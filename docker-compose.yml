services:
  api:
    build: .
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [db, redis]
    volumes: [".:/app"]
    command: uvicorn newton.main:app --host 0.0.0.0 --port 8080 --reload

  worker:
    build: .
    env_file: .env
    depends_on: [db, redis]
    volumes: [".:/app"]
    command: python -m workers.run_worker

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: newton
      POSTGRES_PASSWORD: newton
      POSTGRES_DB: newton
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:
