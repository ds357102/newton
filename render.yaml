services:
  - type: web
    name: newton
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NEWTON_ENV
        value: prod
      - key: ANTHROPIC_API_KEY
        sync: false   # set in Render dashboard
  - type: worker
    name: newton-streamer
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m workers.streamer
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
