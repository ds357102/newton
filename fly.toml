# Fly.io config. Run `fly launch --no-deploy` then `fly deploy`.
app = "newton"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NEWTON_ENV = "prod"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.checks]
    [http_service.checks.healthcheck]
      method = "GET"
      path = "/healthz"
      interval = "30s"
      timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
